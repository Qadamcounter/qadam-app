name: Build Qadam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Unzip the app project
        run: unzip -o qadam-app.zip -d proj

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Create the Android project shell
        run: flutter create --platforms=android --project-name qadam_step_counter --org com.qadam scaffold

      - name: Copy our app into the shell
        run: |
          cp proj/qadam-app/lib/main.dart scaffold/lib/main.dart
          cp proj/qadam-app/pubspec.yaml scaffold/pubspec.yaml
          mkdir -p scaffold/assets
          cp -r proj/qadam-app/assets/audio scaffold/assets/
          cp -r proj/qadam-app/assets/icon scaffold/assets/
          cp proj/qadam-app/override/AndroidManifest.xml scaffold/android/app/src/main/AndroidManifest.xml

      - name: Download packages
        working-directory: scaffold
        run: flutter pub get

      - name: Generate launcher icons (ok if this step fails)
        working-directory: scaffold
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      - name: Build the APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Sign the APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/qadam-release.jks
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=scaffold/build/app/outputs/flutter-apk/app-release.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 $APK /tmp/aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks /tmp/qadam-release.jks --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEYSTORE_PASSWORD --ks-key-alias $KEY_ALIAS --out scaffold/build/app/outputs/flutter-apk/app-release-signed.apk /tmp/aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs scaffold/build/app/outputs/flutter-apk/app-release-signed.apk

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: qadam-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release-signed.apk
